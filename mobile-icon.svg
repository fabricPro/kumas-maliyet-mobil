<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#2455d4"/>
  <!-- Dokuma deseni (merkezde, maskable güvenli alan içinde) -->
  <g stroke="#ffffff" stroke-opacity="0.28" stroke-width="10" stroke-linecap="round">
    <!-- Dikey (çözgü) -->
    <line x1="152" y1="140" x2="152" y2="372"/>
    <line x1="196" y1="140" x2="196" y2="372"/>
    <line x1="240" y1="140" x2="240" y2="372"/>
    <line x1="284" y1="140" x2="284" y2="372"/>
    <line x1="328" y1="140" x2="328" y2="372"/>
    <line x1="372" y1="140" x2="372" y2="372"/>
    <!-- Yatay (atkı) -->
    <line x1="140" y1="172" x2="384" y2="172"/>
    <line x1="140" y1="216" x2="384" y2="216"/>
    <line x1="140" y1="260" x2="384" y2="260"/>
    <line x1="140" y1="304" x2="384" y2="304"/>
    <line x1="140" y1="348" x2="384" y2="348"/>
  </g>
  <!-- Merkez disk (okunabilirlik için hafif koyu) -->
  <circle cx="256" cy="256" r="108" fill="#1b3fa3" fill-opacity="0.85"/>
  <!-- $ sembolü -->
  <text x="256" y="256" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="168" font-weight="800" fill="#ffffff">$</text>
</svg>
